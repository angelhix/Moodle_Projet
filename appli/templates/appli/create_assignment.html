{% extends "appli/base.html" %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Créer un nouveau devoir pour {{ course.titre }}</h1>

    <div class="card shadow-sm">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="titre" class="form-label">Titre du devoir</label>
                    <input type="text" name="titre" id="titre" class="form-control" placeholder="Ex: Examen Chapitre 3" required>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea name="description" id="description" class="form-control" rows="4" placeholder="Instructions pour les étudiants"></textarea>
                </div>

                <div class="mb-3">
                    <label for="date_limite" class="form-label">Date limite</label>
                    <input type="date" name="date_limite" id="date_limite" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success w-100">Créer le devoir</button>
            </form>
        </div>
    </div>

   <a href="{% url 'courses_teacher_detail' course.id %}" class="btn btn-secondary mt-3">Retour au cours</a>

</div>
{% endblock %}
