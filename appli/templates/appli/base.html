<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Mon Application{% endblock %}</title>
    <style>
        body {
            margin:0;
            font-family:'Inter', sans-serif;
            background: linear-gradient(135deg,#1a237e,#0d47a1);
            color:white;
            min-height:100vh;
            display:flex;
        }

        /* SIDEBAR */
        .sidebar {
            width:220px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(15px);
            display:flex;
            flex-direction:column;
            padding:2rem 1rem;
        }

        .sidebar a {
            color:white;
            text-decoration:none;
            margin:1rem 0;
            font-weight:500;
            display:flex;
            align-items:center;
            gap:10px;
            transition: all 0.3s;
            padding:0.5rem;
            border-radius:10px;
        }

        .sidebar a:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(5px);
        }

        .sidebar .logo {
            font-size:1.5rem;
            font-weight:700;
            margin-bottom:2rem;
            cursor:pointer;
            text-align:center;
        }

        .main-content {
            flex:1;
            padding:2rem;
        }

        h1 {
            margin-bottom:2rem;
        }

        table {
            width:100%;
            border-collapse: collapse;
            margin-top:1rem;
        }

        table, th, td {
            border:1px solid rgba(255,255,255,0.3);
        }

        th, td {
            padding:0.5rem;
            text-align:left;
        }

        th {
            background: rgba(255,255,255,0.1);
        }

        tr:nth-child(even) {
            background: rgba(255,255,255,0.05);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo" onclick="window.location.href='{% url 'profile_teacher' %}'">
            🎓 {{ request.user.username }}
        </div>
        <a href="{% url 'teacher_dashboard' %}">🏠 Dashboard</a>
        <a href="{% url 'courses_teacher' %}">📚 Mes cours</a>
        <a href="{% url 'assignments_teacher' %}">📝 Devoirs</a>
        <a href="{% url 'submissions_teacher' %}">📥 Soumissions</a>
        <a href="{% url 'logout' %}">🚪 Déconnexion</a>
    </div>

    <div class="main-content">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
